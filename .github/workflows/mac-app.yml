name: Mac app

# Builds a runnable Cerebro.app and a drag-to-install DMG on GitHub's macOS
# runners, so getting the app onto a Mac never requires a local toolchain.
#
# Every push to a branch produces a downloadable artifact (Actions → this run →
# Artifacts). Pushing a `v*` tag additionally publishes a release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# The DMG is a universal binary, so one download runs on both Apple Silicon and
# Intel and nobody has to know which Mac they have.
env:
  TARGET: universal-apple-darwin

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust with both Mac targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          pnpm vitest run
          cargo test --manifest-path src-tauri/Cargo.toml

      # Only the .app here — the DMG is assembled in the next step, after the
      # bundle is signed, so what ships inside it is the signed copy.
      - name: Build the app
        run: pnpm tauri build --target $TARGET --bundles app

      - name: Sign and package
        run: ./scripts/mac-package.sh "target/$TARGET/release/bundle/macos/Cerebro.app"

      - uses: actions/upload-artifact@v4
        with:
          name: Cerebro-macOS
          path: dist-mac/Cerebro.dmg
          if-no-files-found: error

      - name: Publish a release for a tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-mac/Cerebro.dmg
          body: |
            Download `Cerebro.dmg`, open it, and drag Cerebro to Applications.

            macOS quarantines apps downloaded from the internet and this build
            is not notarized, so clear the flag once after installing:

            ```
            xattr -dr com.apple.quarantine /Applications/Cerebro.app
            ```

            The assistant uses the Claude Code CLI already installed on your
            machine — no API key goes into the app.
