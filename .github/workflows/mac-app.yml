name: Mac app

# Builds a runnable Cerebro.app and a drag-to-install DMG on GitHub's macOS
# runners, so getting the app onto a Mac never requires a local toolchain.
#
# Every push produces downloadable artifacts (Actions → this run → Artifacts).
# Pushing a `v*` tag additionally publishes a release with both DMGs attached.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# Pushing again supersedes the previous build for the same ref rather than
# leaving it to finish a compile nobody is waiting for any more.
concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One job per architecture, in parallel. A universal binary would be a
    # single download, but it compiles the whole dependency tree twice in
    # sequence on one runner; two runners doing one architecture each halves
    # the wall clock and still covers every Mac.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: AppleSilicon
          - target: x86_64-apple-darwin
            label: Intel
    runs-on: macos-14
    # A cold build of the Tauri dependency tree is slow but bounded. Past this
    # something is wrong, and failing says so instead of burning six hours.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Run the suites once rather than in both matrix legs — they are
      # architecture-independent, and Apple Silicon is the runner's native arch.
      - name: Test
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          pnpm vitest run
          cargo test --manifest-path src-tauri/Cargo.toml

      # Only the .app here — the DMG is assembled in the next step, after the
      # bundle is signed, so what ships inside it is the signed copy.
      # `--ci` so a prompt can never turn a build into a hung runner.
      - name: Build the app
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles app

      - name: Sign and package
        run: |
          ./scripts/mac-package.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Cerebro.app" \
            "Cerebro-${{ matrix.label }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Cerebro-${{ matrix.label }}
          path: dist-mac/Cerebro-${{ matrix.label }}.dmg
          if-no-files-found: error

      - name: Publish a release for a tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-mac/Cerebro-${{ matrix.label }}.dmg
          body: |
            Download the DMG for your Mac — `Cerebro-AppleSilicon.dmg` for any
            M-series Mac, `Cerebro-Intel.dmg` for an older Intel one. Open it
            and drag Cerebro to Applications.

            macOS quarantines apps downloaded from the internet and this build
            is not notarized, so clear the flag once after installing:

            ```
            xattr -dr com.apple.quarantine /Applications/Cerebro.app
            ```

            The assistant uses the Claude Code CLI already installed on your
            machine — no API key goes into the app.
