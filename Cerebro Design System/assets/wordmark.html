<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:0;display:flex;height:170px}
.a{flex:1.2;display:flex;flex-direction:column;justify-content:center;padding-left:24px;gap:6px}
.mark{font-weight:700;font-size:44px;letter-spacing:-0.02em;color:var(--n-900)}
.mark i{font-style:normal;color:var(--synapse-500)}
.note{font-size:var(--text-2xs);color:var(--text-muted);max-width:240px;line-height:15px}
.b{flex:1;background:var(--cortex-500);display:flex;align-items:center;justify-content:center}
.b .mark{color:#fff}.b .mark i{color:#EFB428}</style></head><body>
<div class="a"><div class="mark">cerebro<i>.</i></div><div class="note">Instrument Sans 700, lowercase, −0.02em. Period in synapse violet (amber on cortex). No logo asset provided — none invented.</div></div>
<div class="b"><div class="mark">cerebro<i>.</i></div></div>
</body></html>
