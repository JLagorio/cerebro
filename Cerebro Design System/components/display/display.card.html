<!-- @dsCard group="Components" viewport="700x300" name="Display" subtitle="Badges, tags, avatars, entity glyphs, health, progress" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Badge, Tag, Avatar, AvatarGroup, EntityIcon, HealthChip, ProgressBar, StatusFlag } = window.CerebroDesignSystem_d5fb9b;
const row = { display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 12 };
const lbl = { fontSize: 11, color: "var(--n-500)", width: 64, flex: "none" };
function Demo() {
  return (
    <div>
      <div style={row}><span style={lbl}>Badges</span><Badge>Beta</Badge><Badge tone="info">8 items</Badge><Badge tone="ai">Generated</Badge><Badge tone="success" variant="outline">On track</Badge><Badge tone="danger">Blocked</Badge></div>
      <div style={row}><span style={lbl}>Tags</span><Tag icon="diamond">Introduce SSO</Tag><Tag color="var(--swatch-teal)" onRemove={()=>{}}>Mobile onboarding</Tag><Tag icon="flag">Version 3</Tag><Tag icon="target">Increase adoption</Tag></div>
      <div style={row}><span style={lbl}>Status</span><StatusFlag status="idea" /><StatusFlag status="planned" /><StatusFlag status="progress" /><StatusFlag status="validation" /><StatusFlag status="released" /><StatusFlag status="wontdo" /></div>
      <div style={row}><span style={lbl}>Health</span><HealthChip health="on" /><HealthChip health="risk" /><HealthChip health="off" /><HealthChip /></div>
      <div style={row}><span style={lbl}>Entities</span>{["product","component","feature","subfeature","initiative","objective","keyResult","release","company","user","finding","opportunity"].map(t => <span key={t} style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11,color:"var(--n-600)"}}><EntityIcon type={t} size={15} />{t}</span>)}</div>
      <div style={row}><span style={lbl}>People</span><Avatar name="Josef Lang" size={20} /><Avatar name="Ana Rios" /><Avatar name="Sam Ito" size={28} /><AvatarGroup names={["Josef Lang","Ana Rios","Sam Ito","Mo Byrd","Kai Wren"]} /></div>
      <div style={row}><span style={lbl}>Progress</span><ProgressBar value={0} showLabel /><ProgressBar value={40} showLabel /><ProgressBar value={92} tone="success" showLabel /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
