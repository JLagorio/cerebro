<!-- @dsCard group="Foundations" viewport="700x150" subtitle="Surface stack + hairline borders" name="Surfaces & borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;display:flex;gap:12px}
.s{flex:1;height:96px;border-radius:var(--r-lg);padding:10px 12px;font-size:var(--text-xs);color:var(--text-muted)}
.s b{display:block;color:var(--text-secondary);font-weight:500;margin-bottom:2px}
.m{font-family:var(--font-mono);font-size:10px}</style></head><body>
<div class="s" style="background:var(--surface-app);border:1px solid var(--n-200)"><b>App canvas</b><span class="m">n-0 · white</span></div>
<div class="s" style="background:var(--surface-board);border:1px solid var(--n-200)"><b>Board canvas</b><span class="m">n-25</span></div>
<div class="s" style="background:var(--surface-sunken);border:1px solid var(--n-200)"><b>Sidebar / wells</b><span class="m">n-50</span></div>
<div class="s" style="background:#fff;border:1px solid var(--n-300)"><b>Strong border</b><span class="m">n-300</span></div>
<div class="s" style="background:var(--surface-selected);border:1px solid var(--cortex-200)"><b>Selected</b><span class="m">cortex-50 / 200</span></div>
</body></html>
