<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;gap:12px;align-items:stretch}
.ramp{display:flex;flex-direction:column;width:120px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--n-200)}
.ramp div{flex:1;display:flex;align-items:center;padding:0 8px;font-family:var(--font-mono);font-size:10px}
.ai{flex:1;background:var(--surface-ai);border:1px solid var(--synapse-200);border-radius:var(--r-lg);padding:12px 14px}
.ai .hd{display:flex;align-items:center;gap:6px;color:var(--text-ai);font-weight:600;font-size:var(--text-xs);margin-bottom:6px}
.ai p{margin:0;color:var(--n-700);font-size:var(--text-xs);line-height:18px}
.ai .src{margin-top:8px;font-size:var(--text-2xs);color:var(--synapse-600)}
.rule{width:190px;font-size:var(--text-xs);color:var(--text-muted);line-height:18px}.rule b{color:var(--text-secondary)}</style></head><body>
<div class="ramp"><div style="background:var(--synapse-50);color:var(--synapse-700)">50</div><div style="background:var(--synapse-100);color:var(--synapse-700)">100</div><div style="background:var(--synapse-300);color:#fff">300</div><div style="background:var(--synapse-500);color:#fff">500</div><div style="background:var(--synapse-700);color:#fff">700</div></div>
<div class="ai"><div class="hd"><svg width="12" height="12" viewBox="0 0 24 24" fill="var(--synapse-500)"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4L12 2z"/></svg>AI summary</div><p>Field teams struggle with mobile onboarding; adoption depends on a guided setup flow.</p><div class="src">From 6 signals · 4 teams</div></div>
<div class="rule"><b>Rule:</b> synapse marks machine-generated content — ask-bar, summaries, findings, agent chips. Never a generic accent; flat tints, no gradients.</div>
</body></html>
