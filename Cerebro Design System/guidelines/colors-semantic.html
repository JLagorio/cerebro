<!-- @dsCard group="Colors" viewport="700x140" subtitle="Success · warning · danger, solid + tint" name="Semantic" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;gap:12px}
.g{flex:1;border:1px solid var(--n-200);border-radius:var(--r-lg);overflow:hidden}
.solid{height:44px;display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:var(--text-xs)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--r-full);font-weight:500;font-size:var(--text-xs)}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-left:auto}</style></head><body>
<div class="g"><div class="solid" style="background:var(--success-500)">Success</div><div class="row" style="background:var(--success-50)"><span class="chip" style="background:#fff;color:var(--success-700);border:1px solid var(--success-500)">On track</span><span class="mono">500 / 50</span></div></div>
<div class="g"><div class="solid" style="background:var(--warn-500)">Warning</div><div class="row" style="background:var(--warn-50)"><span class="chip" style="background:#fff;color:var(--warn-700);border:1px solid var(--warn-500)">At risk</span><span class="mono">500 / 50</span></div></div>
<div class="g"><div class="solid" style="background:var(--danger-500)">Danger</div><div class="row" style="background:var(--danger-50)"><span class="chip" style="background:#fff;color:var(--danger-700);border:1px solid var(--danger-500)">Off track</span><span class="mono">500 / 50</span></div></div>
</body></html>
