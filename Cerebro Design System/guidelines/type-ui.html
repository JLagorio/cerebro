<!-- @dsCard group="Type" viewport="700x240" subtitle="Instrument Sans — UI scale" name="UI type scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px}
.r{display:flex;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px solid var(--n-100)}
.r:last-child{border:none}
.m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);width:150px;flex:none}</style></head><body>
<div class="r"><span class="m">2xs · 11/16 · 600 caps</span><span style="font-size:var(--text-2xs);font-weight:600;letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-muted)">Eyebrow label</span></div>
<div class="r"><span class="m">xs · 12/16 · 400</span><span style="font-size:var(--text-xs);color:var(--text-secondary)">Meta, timestamps, helper text</span></div>
<div class="r"><span class="m">sm · 13/20 · 400</span><span style="font-size:var(--text-sm)">Base UI — tables, nav, controls</span></div>
<div class="r"><span class="m">sm · 13/20 · 500</span><span style="font-size:var(--text-sm);font-weight:500">Emphasis in base UI, item names</span></div>
<div class="r"><span class="m">md · 14/20 · 500</span><span style="font-size:var(--text-md);font-weight:500">Section titles, panel headers</span></div>
<div class="r"><span class="m">lg · 16/24 · 600</span><span style="font-size:var(--text-lg);font-weight:600;letter-spacing:var(--track-tight)">Dialog titles, entity names</span></div>
<div class="r"><span class="m">xl · 20/28 · 600</span><span style="font-size:var(--text-xl);font-weight:600;letter-spacing:var(--track-tight)">Page titles</span></div>
</body></html>
