<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/cerebro-design-system-d5fb9b6c-a7d7-40f8-ad80-3a48e4462af5/tokens/fonts.css">
<link rel="stylesheet" href="_ds/cerebro-design-system-d5fb9b6c-a7d7-40f8-ad80-3a48e4462af5/tokens/colors.css">
<link rel="stylesheet" href="_ds/cerebro-design-system-d5fb9b6c-a7d7-40f8-ad80-3a48e4462af5/tokens/typography.css">
<link rel="stylesheet" href="_ds/cerebro-design-system-d5fb9b6c-a7d7-40f8-ad80-3a48e4462af5/tokens/spacing.css">
<link rel="stylesheet" href="_ds/cerebro-design-system-d5fb9b6c-a7d7-40f8-ad80-3a48e4462af5/tokens/base.css">
<link rel="stylesheet" href="_ds/cerebro-design-system-d5fb9b6c-a7d7-40f8-ad80-3a48e4462af5/styles.css">
<script src="_ds/cerebro-design-system-d5fb9b6c-a7d7-40f8-ad80-3a48e4462af5/_ds_bundle.js"></script>
<script src="./store.js"></script>
</helmet>
<div style="flex:1;height:100%;min-width:0;overflow-y:auto;background:var(--n-25);font-family:var(--font-ui);font-size:13px;line-height:20px;color:var(--n-900)">
  <div style="max-width:860px;margin:0 auto;padding:24px 28px 56px">

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <h1 style="margin:0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-0.01em">Notifications</h1>
      <x-import component-from-global-scope="CerebroDesignSystem_d5fb9b.Badge" tone="danger" hint-size="auto,18px">{{ unread }} unread</x-import>
      <div style="flex:1"></div>
      <x-import component-from-global-scope="CerebroDesignSystem_d5fb9b.Button" size="sm" variant="ghost" onClick="{{ clearAll }}" hint-size="auto,28px">Mark all read</x-import>
    </div>
    <div style="font-size:12px;color:var(--n-600);margin-bottom:20px">Every notice names the source that changed and what it touches downstream.</div>

    <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
      <div onClick="{{ onClick }}" style="display:flex;flex-direction:column;gap:20px">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
          <div>
            <div style="font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--n-500);margin-bottom:8px">{{ g.label }}</div>
            <div style="background:var(--n-0);border:1px solid var(--n-200);border-radius:10px;box-shadow:var(--shadow-sm);overflow:hidden">
              <sc-for list="{{ g.items }}" as="n" hint-placeholder-count="3">
                <div style="display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--n-100);background:{{ n.bg }}">
                  <div style="width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:{{ n.iconBg }};color:{{ n.iconFg }}"><x-import component-from-global-scope="CerebroDesignSystem_d5fb9b.Icon" name="{{ n.icon }}" size="{{ n14 }}" hint-size="14px,14px"></x-import></div>
                  <div style="flex:1;min-width:0">
                    <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
                      <span style="font-size:11px;font-weight:600;color:var(--n-600);background:var(--n-100);border-radius:4px;padding:1px 5px">{{ n.source }}</span>
                      <span style="font-size:13px;font-weight:600;color:var(--n-900)">{{ n.title }}</span>
                      <span style="font-size:11px;color:var(--n-500)">{{ n.when }}</span>
                    </div>
                    <div style="font-size:13px;color:var(--n-700);margin-top:5px;line-height:20px;text-wrap:pretty">{{ n.body }}</div>
                    <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
                      <span style="font-size:11px;font-weight:500;color:{{ n.impactColor }}">{{ n.impact }}</span>
                      <div style="flex:1"></div>
                      <button type="button" data-review="{{ n.goto }}" style="height:26px;padding:0 10px;border:1px solid var(--cortex-500);background:var(--cortex-500);color:#fff;border-radius:6px;font-family:var(--font-ui);font-size:12px;font-weight:500;cursor:pointer;display:{{ n.reviewVis }}" style-hover="background:var(--cortex-600)">{{ n.reviewLabel }}</button>
                      <button type="button" data-dismiss="{{ n.id }}" style="height:26px;padding:0 10px;border:1px solid var(--n-300);background:var(--n-0);color:var(--n-700);border-radius:6px;font-family:var(--font-ui);font-size:12px;cursor:pointer" style-hover="background:var(--n-50)">Dismiss</button>
                    </div>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ empty }}">
      <div style="background:var(--n-0);border:1px solid var(--n-200);border-radius:10px;box-shadow:var(--shadow-sm)">
        <x-import component-from-global-scope="CerebroDesignSystem_d5fb9b.EmptyState" icon="inbox" title="Nothing needs your attention" description="Attest raises a notice when a connected source changes something the baseline depends on." hint-size="100%,200px"></x-import>
      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:860}}">
const NOTES = [
  { id: "n1", group: "Today", source: "Cameo", icon: "workflow", tone: "warn", title: "Crypto module changed on WBS 1.1.5.3",
    when: "06:58", body: "Model revision 41 replaced the KGV-72M with a KI-700 at 384-bit keys. SC-12, SC-13 and IA-7 still describe the old module and three security plan blocks quote the retired key length.",
    impact: "3 controls · 3 SP blocks · 1 test procedure · 1 release", goto: "impact", reviewLabel: "Review CHG-118", unread: true },
  { id: "n2", group: "Today", source: "CISA", icon: "shield-alert", tone: "danger", title: "Advisory ICSA-26-189-02 matches your inventory",
    when: "05:40", body: "The advisory affects the processor family used by the flight control computer bootloader v4.2.1. SI-7(9) is proposed for the baseline and nothing in the security plan covers boot verification yet.",
    impact: "1 control proposed · evidence gap", goto: "impact", reviewLabel: "Review CHG-119", unread: true },
  { id: "n3", group: "Today", source: "TeamCenter", icon: "boxes", tone: "danger", title: "Connection authentication expired",
    when: "04:15", body: "Attest has not been able to read configuration items for two days. Firmware version checks against advisories are running on stale data until this is reconnected.",
    impact: "3,102 items not refreshed", goto: "sources", reviewLabel: "Open connections", unread: true },
  { id: "n4", group: "Yesterday", source: "Jama", icon: "file-badge", tone: "warn", title: "REQ-GT-0409 reworded",
    when: "14:20", body: "Module authentication is now required before operational mode rather than within ten seconds of power-on. IA-7 needs a wording change and the test procedure measures a window that no longer applies.",
    impact: "1 control · 1 SP block · 1 procedure", goto: "impact", reviewLabel: "Review CHG-120", unread: true },
  { id: "n5", group: "Yesterday", source: "SharePoint", icon: "folder", tone: "info", title: "Nine evidence links point at moved files",
    when: "11:02", body: "A site migration changed the paths. Cerebro can remap them by document identifier and will list anything it cannot match with confidence.",
    impact: "9 artifacts · 14 controls affected", goto: "docs", reviewLabel: "Open documentation", unread: false },
  { id: "n6", group: "Yesterday", source: "Cerebro", icon: "sparkles", tone: "ai", title: "Weekly coverage summary",
    when: "07:00", body: "Sixty-eight controls still have no evidence, concentrated in SR and SI. The assessor asked for artifacts on every partially implemented row before Rev D is issued.",
    impact: "68 controls without evidence", goto: "sctm", reviewLabel: "Open the matrix", unread: false }
];

const TONE = {
  warn: { bg: "var(--warn-50)", fg: "var(--warn-700)" },
  danger: { bg: "var(--danger-50)", fg: "var(--danger-700)" },
  info: { bg: "var(--n-100)", fg: "var(--n-600)" },
  ai: { bg: "var(--synapse-50)", fg: "var(--synapse-600)" }
};

class Component extends DCLogic {
  state = { dismissed: {} };
  componentDidMount() { this._bind(); }
  componentWillUnmount() { if (this._un) this._un(); clearInterval(this._iv); }
  _bind() {
    const s = window.__attest;
    if (s) { this._un = s.sub(() => this.forceUpdate()); this.forceUpdate(); return; }
    this._iv = setInterval(() => { if (window.__attest) { clearInterval(this._iv); this._bind(); } }, 40);
  }
  renderVals() {
    const S = window.__attest;
    const base = { n14: 14 };
    if (!S) return base;
    const d = this.state.dismissed;
    const live = NOTES.filter((n) => !d[n.id]);
    const groups = ["Today", "Yesterday"].map((label) => ({
      label, items: live.filter((n) => n.group === label).map((n) => {
        const t = TONE[n.tone];
        return {
          id: n.id, source: n.source, title: n.title, when: n.when, body: n.body, impact: n.impact,
          icon: n.icon, iconBg: t.bg, iconFg: t.fg,
          bg: n.unread ? "var(--n-0)" : "var(--n-25)",
          impactColor: n.tone === "danger" ? "var(--danger-600)" : n.tone === "warn" ? "var(--warn-600)" : "var(--n-500)",
          goto: n.goto, reviewLabel: n.reviewLabel, reviewVis: "inline-flex"
        };
      })
    })).filter((g) => g.items.length);
    return Object.assign(base, {
      groups, hasItems: live.length > 0, empty: live.length === 0,
      unread: live.filter((n) => n.unread).length,
      onClick: (e) => {
        const r = e.target.closest("[data-review]");
        const x = e.target.closest("[data-dismiss]");
        if (r) {
          const to = r.getAttribute("data-review");
          const label = r.textContent || "";
          if (to === "impact") {
            const m = label.match(/CHG-\d+/);
            if (m) S.set({ openChange: m[0] });
          }
          S.go(to);
          return;
        }
        if (x) {
          const id = x.getAttribute("data-dismiss");
          this.setState({ dismissed: Object.assign({}, this.state.dismissed, { [id]: 1 }) });
          S.set({ notif: Math.max(0, S.state.notif - 1) });
        }
      },
      clearAll: () => {
        const all = {};
        NOTES.forEach((n) => { all[n.id] = 1; });
        this.setState({ dismissed: all });
        S.set({ notif: 0 });
        S.toast({ tone: "default", title: "Notifications cleared", desc: "Open changes still sit in the review queue." });
      }
    });
  }
}

</script>
</body>
</html>
