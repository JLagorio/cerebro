name: At risk
icon: triangle-alert
color: null
order: 2
source:
  type: Work item
  project: null
# Nested AND/OR: urgent work that is either in review or still in progress.
filters:
  all:
    - field: priority
      op: any_of
      value:
        - urgent
        - high
    - any:
        - field: status
          op: equals
          value: progress
        - field: status
          op: equals
          value: review
presentation:
  type: table
  # M9.1: nested grouping — status bands, each split by assignee.
  group:
    - field: status
    - field: assignee
  sort:
    - field: due
      dir: asc
    - field: priority
      dir: asc
  columns:
    - field: status
    - field: priority
    - field: assignee
    - field: due
      width: 120
    - field: estimate
