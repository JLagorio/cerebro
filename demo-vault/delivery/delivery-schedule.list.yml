name: Delivery schedule
icon: chart-gantt
color: null
order: 3
source:
  type: Work item
  project: null
filters: null
presentation:
  # M10: Gantt is the scheduling view — bars on a date axis, plus arrows for the
  # "waits on" claims the data already makes, drawn red where the predecessor
  # does not actually finish before its successor starts.
  type: gantt
  # `window` is a daterange, so a bar spans real work rather than sitting on a
  # single deadline. Stated explicitly here, though the view would infer it:
  # Work item declares exactly one daterange.
  dateField: window
  zoom: month
  # Never inferred — a guessed relation would draw a critical path the data
  # does not claim. `blocked_by` is how blocking is modelled on Work item.
  dependencyField: blocked_by
  group:
    - field: status
  sort:
    - field: due
      dir: asc
  columns:
    - field: status
    - field: assignee
    - field: due
    - field: estimate
