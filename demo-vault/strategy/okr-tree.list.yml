# A List inside the Strategy Collection. Every List lives in one — a folder
# holding Lists IS a Collection, so there is no such thing as a loose List and
# no "Lists" bucket in the sidebar for one to fall into.
#
# The pre-M10 `views/*.yml` shape still LOADS (see vault/write.rs list_views) and
# such a file is edited in place rather than relocated; this vault simply has
# none left.
name: OKR tree
icon: target
color: null
order: 1
source:
  type: Objective
  project: null
filters: null
presentation:
  # M10: a TABLE that nests. There is no hierarchy view kind any more — nesting
  # is what a relation level of the grouping chain does, so the view that used
  # to be the only place you could see this is now just one layout among many.
  type: table
  # M9.7: ONE chain. A level names a property (records band by its value) or
  # a relation (records nest under what they link to). Level 0 inverts the
  # link key results hold — `objective:` points UP, so the parent needs no
  # duplicate list; level 1 follows the list key results DO hold. Mixing the
  # two directions is the point: a chain should not care which side of each
  # link the data lives on.
  group:
    - relation: { type: Key result, field: objective }
    - relation: { direction: forward, field: deliverables }
  sort:
    - field: title
      dir: asc
  columns:
    - field: status
    - field: owner
    - field: progress
    - field: key_result_count
