# Deliberately left in the legacy `views/` directory (M10). It loads as a List
# with no Collection and surfaces under "Lists" in the sidebar — the guarantee
# that a vault written before M10 keeps working without anything moving. Editing
# it rewrites THIS file rather than migrating it to a .list.yml, because
# silently relocating someone's file on a toolbar click is a surprise, not a
# migration.
name: OKR tree
icon: target
color: null
order: 1
source:
  type: Objective
  project: null
filters: null
presentation:
  # M10: a TABLE that nests. There is no hierarchy view kind any more — nesting
  # is what a relation level of the grouping chain does, so the view that used
  # to be the only place you could see this is now just one of six layouts.
  type: table
  # M9.7: ONE chain. A level names a property (records band by its value) or
  # a relation (records nest under what they link to). Level 0 inverts the
  # link key results hold — `objective:` points UP, so the parent needs no
  # duplicate list; level 1 follows the list key results DO hold. Mixing the
  # two directions is the point: a chain should not care which side of each
  # link the data lives on.
  group:
    - relation: { type: Key result, field: objective }
    - relation: { direction: forward, field: deliverables }
  sort:
    - field: title
      dir: asc
  columns:
    - field: status
    - field: owner
    - field: progress
    - field: key_result_count
