<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Avatar</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--surface-app);
        color: var(--text-primary);
        font-family: var(--font-ui);
        font-size: var(--fs-sm);
        line-height: var(--lh-sm);
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .cap {
        min-width: 72px;
        font-size: var(--fs-meta);
        line-height: var(--lh-meta);
        color: var(--text-meta);
      }
      .item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--n-800);
      }
      .px {
        font-size: var(--fs-2xs);
        color: var(--n-400);
        font-family: var(--font-mono);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var h = React.createElement,
        C = window.Cerebro;
      function Row(cap, kids) {
        return h('div', { className: 'row' }, h('span', { className: 'cap' }, cap), kids);
      }
      var PEOPLE = [
        'Ana Rios',
        'Dana Fox',
        'Elena Vasquez',
        'Marcus Webb',
        'Maya Chen',
        'Priya Nair',
        'Sam Ito',
        'Tom Keller',
      ];
      var PHOTO =
        'data:image/svg+xml,' +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2b38c"/><stop offset="1" stop-color="#7a4b8f"/></linearGradient></defs><rect width="40" height="40" fill="url(#g)"/><circle cx="20" cy="16" r="7" fill="#fbe3d3"/><path d="M6 40c2-9 8-13 14-13s12 4 14 13z" fill="#fbe3d3"/></svg>',
        );
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'col' },
          Row(
            'sizes',
            [18, 20, 24, 28, 36].map(function (s) {
              return h(
                'span',
                { key: s, className: 'item' },
                h(C.Avatar, { name: 'Ana Rios', size: s }),
                h('span', { className: 'px' }, s),
              );
            }),
          ),
          Row(
            'people',
            PEOPLE.map(function (n) {
              return h(
                'span',
                { key: n, className: 'item' },
                h(C.Avatar, { name: n, size: 20 }),
                h('span', null, n),
              );
            }),
          ),
          Row(
            'image',
            h(
              'span',
              { className: 'item' },
              h(C.Avatar, { name: 'Priya Nair', size: 28, src: PHOTO }),
              h('span', null, 'Priya Nair'),
            ),
          ),
          Row('group', [
            h(C.AvatarGroup, {
              key: 'a',
              names: ['Ana Rios', 'Maya Chen', 'Sam Ito', 'Tom Keller', 'Dana Fox'],
            }),
            h(C.AvatarGroup, { key: 'b', names: ['Marcus Webb', 'Elena Vasquez'], size: 20 }),
            h(C.AvatarGroup, { key: 'c', names: PEOPLE, size: 28, max: 4 }),
          ]),
        ),
      );
    </script>
  </body>
</html>
