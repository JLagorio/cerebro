<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Badge</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--surface-app);
        color: var(--text-primary);
        font-family: var(--font-ui);
        font-size: var(--fs-sm);
        line-height: var(--lh-sm);
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .cap {
        min-width: 88px;
        font-size: var(--fs-meta);
        line-height: var(--lh-meta);
        color: var(--text-meta);
      }
      .line {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: var(--fs-ui);
        line-height: var(--lh-ui);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var h = React.createElement,
        C = window.Cerebro;
      function Row(cap, kids) {
        return h('div', { className: 'row' }, h('span', { className: 'cap' }, cap), kids);
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'col' },
          Row('variants', [
            h(C.Badge, { key: 'd' }, 'Opus'),
            h(C.Badge, { key: 's', variant: 'secondary' }, 'cerebro-researcher'),
            h(C.Badge, { key: 'x', variant: 'destructive' }, 'Failed files: 2'),
            h(C.Badge, { key: 'o', variant: 'outline' }, 'Gmail'),
            h(C.Badge, { key: 'g', variant: 'ghost' }, '3 sources'),
            h(
              C.Badge,
              {
                key: 'l',
                variant: 'link',
                render: h('button', {
                  type: 'button',
                  style: { cursor: 'pointer', background: 'none' },
                }),
              },
              'cutover-prd.md',
            ),
          ]),
          Row('with icon', [
            h(
              C.Badge,
              { key: 'p', variant: 'secondary' },
              h(C.Icon, { name: 'check', size: 12 }),
              'Passed: 42',
            ),
            h(
              C.Badge,
              { key: 'm', variant: 'outline', className: 'cb-ai-mono' },
              h(C.Icon, { name: 'file-text', size: 12 }),
              'projects/phoenix-warehouse-rollout/cutover-prd.md',
            ),
          ]),
          Row('beside a title', [
            h(
              'span',
              { key: 'a', className: 'line' },
              'Read the cutover playbook',
              h(
                C.Badge,
                { variant: 'secondary' },
                h('span', { className: 'sr' }, 'by the '),
                'cerebro-researcher',
              ),
            ),
            h(
              'span',
              { key: 'b', className: 'line' },
              'Drafted a reply',
              h(
                C.Badge,
                { variant: 'outline', title: 'Ran on the Gmail connector, outside this vault' },
                h('span', { className: 'sr' }, 'on '),
                'Gmail',
              ),
            ),
          ]),
        ),
      );
    </script>
  </body>
</html>
