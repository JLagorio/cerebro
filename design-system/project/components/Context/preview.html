<!-- @dsCard group="AI conversation" height=466 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Context</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--surface-app);
        color: var(--text-primary);
        font-family: var(--font-ui);
        font-size: var(--fs-sm);
        line-height: var(--lh-sm);
      }
      .grid {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr) 280px;
        gap: 24px;
        align-items: start;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .cap {
        font-size: var(--fs-meta);
        line-height: var(--lh-meta);
        color: var(--text-meta);
      }
      .states {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 16px;
        align-items: center;
      }
      .what {
        font-size: var(--fs-meta);
        line-height: var(--lh-meta);
        color: var(--text-secondary);
      }
      .card {
        padding: 12px;
        border: 1px solid var(--border-subtle);
        border-radius: var(--r-lg);
        background: var(--surface-raised);
      }
      .figure {
        margin: 0 0 8px;
        font-size: var(--fs-xs);
        line-height: var(--lh-xs);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var h = React.createElement,
        C = window.Cerebro;
      var readings = [
        [
          'open',
          {
            state: 'recorded',
            used: 124000,
            window: 200000,
            model: 'claude-opus-5-5',
            breakdown: { input: 1840, cacheRead: 118400, cacheWrite: 2950, output: 810 },
          },
          '62% of context used',
        ],
        ['low', { state: 'recorded', used: 400, window: 200000 }, 'a sliver reads <1%, never 0%'],
        ['high', { state: 'recorded', used: 172000, window: 200000 }, 'from 80% the ring warns'],
        ['full', { state: 'recorded', used: 193500, window: 200000 }, 'from 95% it is full'],
        [
          'nowin',
          { state: 'recorded', used: 41200, window: null },
          'no window reported: the count alone',
        ],
        ['nr', { state: 'not_recorded' }, 'not recorded: a dashed ring, no figure'],
        ['un', { state: 'unavailable' }, 'unavailable: the read failed'],
      ];
      var categories = [
        { key: 'sp', name: 'System prompt', tokens: 6797, kind: 'used' },
        { key: 'st', name: 'System tools', tokens: 11840, kind: 'used' },
        { key: 'mcp', name: 'MCP tools', tokens: 412, kind: 'used' },
        { key: 'mem', name: 'Memory files', tokens: null, kind: 'used' },
        { key: 'msg', name: 'Messages', tokens: 103321, kind: 'used' },
        { key: 'def', name: 'MCP tools (deferred)', tokens: 438, kind: 'deferred' },
        { key: 'buf', name: 'Autocompact buffer', tokens: 33000, kind: 'buffer' },
        { key: 'free', name: 'Free space', tokens: 44630, kind: 'free' },
      ];
      function Demo() {
        var ref = React.useRef(null);
        React.useEffect(function () {
          // Rest the pointer on the first reading, so its hover card opens as it does under a mouse.
          var t = setTimeout(function () {
            var trigger = ref.current && ref.current.querySelector('[data-slot="context"]');
            if (trigger)
              trigger.dispatchEvent(
                new PointerEvent('pointermove', {
                  bubbles: true,
                  pointerType: 'mouse',
                  screenX: 12,
                  screenY: 12,
                }),
              );
          }, 50);
          return function () {
            clearTimeout(t);
          };
        }, []);
        return h(
          'div',
          { className: 'grid' },
          h(
            'div',
            { className: 'col' },
            h('span', { className: 'cap' }, 'Hovered or focused: the detail opens'),
            h(
              'span',
              { ref: ref, style: { alignSelf: 'flex-start' } },
              h(C.Context, { usage: readings[0][1], tabIndex: 0 }),
            ),
          ),
          h(
            'div',
            { className: 'col' },
            h('span', { className: 'cap' }, 'The reading in the composer\u2019s toolbar'),
            h(
              'div',
              { className: 'states' },
              readings.map(function (r) {
                return [
                  h('span', { key: r[0] + 'c' }, h(C.Context, { usage: r[1], tabIndex: 0 })),
                  h('span', { key: r[0] + 'w', className: 'what' }, r[2]),
                ];
              }),
            ),
          ),
          h(
            'div',
            { className: 'col' },
            h('span', { className: 'cap' }, 'ContextCategories: what the window holds'),
            h(
              'div',
              { className: 'card' },
              h('p', { className: 'figure' }, '154,370 of 200,000 tokens'),
              h(C.ContextCategories, { categories: categories, window: 200000, more: 2 }),
            ),
            h('span', { className: 'cap' }, 'no window reported: tokens alone, no bar'),
            h(
              'div',
              { className: 'card' },
              h(C.ContextCategories, { categories: categories.slice(0, 5), window: null }),
            ),
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
    </script>
  </body>
</html>
