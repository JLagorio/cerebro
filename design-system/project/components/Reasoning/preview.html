<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reasoning</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--surface-app);
        color: var(--text-primary);
        font-family: var(--font-ui);
        font-size: var(--fs-sm);
        line-height: var(--lh-sm);
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 780px;
      }
      .row {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      .cap {
        padding-top: 1px;
        font-size: var(--fs-meta);
        line-height: var(--lh-meta);
        color: var(--text-meta);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var h = React.createElement,
        C = window.Cerebro;
      function Row(cap, kid) {
        return h(
          'div',
          { className: 'row' },
          h('span', { className: 'cap' }, cap),
          h('div', null, kid),
        );
      }
      var STREAMING =
        'The cutover PRD puts go-live on 30 July. OPS-9, rehearse the rollback in staging, has no date and is still planned.\n\nThe rollback risk says it has never been rehearsed, so';
      var DONE =
        'The cutover PRD puts go-live on 30 July. OPS-9, rehearse the rollback in staging, has no date and is still planned.\n\nThe rollback risk says it has never been rehearsed, so two rehearsals before go-live leave room for a fix between them. The scanner delivery risk blocks the second one only if the hardware slips past 27 July.';
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'col' },
          Row('streaming', h(C.Reasoning, { text: STREAMING, isStreaming: true })),
          Row('done, opened', h(C.Reasoning, { text: DONE, durationMs: 12000, defaultOpen: true })),
          Row('done', h(C.Reasoning, { text: DONE, durationMs: 640 })),
          Row('not measured', h(C.Reasoning, { text: DONE })),
          Row('withheld', h(C.Reasoning, { text: '', redacted: true })),
        ),
      );
    </script>
  </body>
</html>
