<!-- @dsCard group="AI work" height=423 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StepLine</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--surface-app);
        color: var(--text-primary);
        font-family: var(--font-ui);
        font-size: var(--fs-sm);
        line-height: var(--lh-sm);
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 780px;
      }
      .row {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      .cap {
        padding-top: 1px;
        font-size: var(--fs-meta);
        line-height: var(--lh-meta);
        color: var(--text-meta);
      }
      .target {
        font-family: var(--font-mono);
        font-size: var(--fs-2xs);
        color: var(--n-500);
      }
      .target.write {
        color: var(--cortex-700);
      }
      .review {
        padding: 2px 6px;
        border: 1px solid var(--cortex-200);
        border-radius: var(--r-md);
        background: var(--n-0);
        color: var(--cortex-700);
        font: inherit;
        font-size: var(--fs-2xs);
        line-height: var(--lh-2xs);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var h = React.createElement,
        C = window.Cerebro,
        F = React.Fragment;
      function Target(text, write) {
        return h('span', { className: write ? 'target write' : 'target' }, text);
      }
      function Step(cap, head, extra) {
        return h(
          'div',
          { className: 'row' },
          h('span', { className: 'cap' }, cap),
          h('div', { className: 'cb-ai-step' }, h(C.StepHead, head), extra || null),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(
        h(
          'div',
          { className: 'col' },
          Step('running', {
            status: 'running',
            title: 'Find every open risk on the Phoenix cutover',
            after: h(C.Badge, { variant: 'secondary' }, 'cerebro-researcher'),
            description: '3 tool uses',
            progress: 'Reading records/risks/risk-rollback-unrehearsed.md',
          }),
          Step(
            'done',
            {
              status: 'done',
              icon: 'brain',
              description: '1.1s',
              title: h(
                F,
                null,
                'Wrote a concept ',
                Target('knowledge/systems/warehouse-rollback.md', true),
              ),
            },
            h(
              C.StepExtra,
              null,
              h('button', { type: 'button', className: 'review' }, 'Open to review'),
            ),
          ),
          Step('failed', {
            status: 'failed',
            icon: 'replace',
            title: h(
              F,
              null,
              'Failed to edit a note ',
              Target('projects/phoenix-warehouse-rollout/items/ops-4.md', true),
            ),
          }),
          Step('denied', {
            status: 'denied',
            icon: 'globe',
            title: h(F, null, 'Denied: WebSearch ', Target('scanner firmware 4.2 release notes')),
          }),
          Step('interrupted', {
            status: 'interrupted',
            icon: 'pencil',
            title: h(
              F,
              null,
              'Write ',
              Target('projects/phoenix-warehouse-rollout/cutover-prd.md', true),
            ),
          }),
          Step('waiting', {
            status: 'waiting',
            icon: 'file-plus',
            title: h(
              F,
              null,
              'create note ',
              Target('projects/phoenix-warehouse-rollout/items', true),
            ),
          }),
          Step('not run', {
            status: 'not_run',
            icon: 'file-pen',
            title: h(
              F,
              null,
              'append to note ',
              Target('records/risks/risk-scanner-delivery.md', true),
            ),
          }),
          Step('paused', {
            status: 'paused',
            icon: 'terminal',
            title: h(F, null, 'Bash ', Target('pnpm e2e')),
          }),
        ),
      );
    </script>
  </body>
</html>
