<!-- @dsCard group="Colors" viewport="700x130" subtitle="12-step cool graphite ramp" name="Neutrals" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px}
.ramp{display:flex;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--n-200)}
.ramp div{flex:1;height:64px;position:relative}
.ramp span{position:absolute;left:6px;bottom:6px;font-family:var(--font-mono);font-size:10px}
.roles{display:flex;gap:16px;margin-top:10px;font-size:var(--text-xs);color:var(--text-muted)}
.roles b{color:var(--text-secondary);font-weight:500}</style></head><body>
<div class="ramp">
<div style="background:var(--n-0)"><span style="color:var(--n-500)">0</span></div>
<div style="background:var(--n-25)"><span style="color:var(--n-500)">25</span></div>
<div style="background:var(--n-50)"><span style="color:var(--n-500)">50</span></div>
<div style="background:var(--n-100)"><span style="color:var(--n-600)">100</span></div>
<div style="background:var(--n-200)"><span style="color:var(--n-600)">200</span></div>
<div style="background:var(--n-300)"><span style="color:var(--n-700)">300</span></div>
<div style="background:var(--n-400)"><span style="color:#fff">400</span></div>
<div style="background:var(--n-500)"><span style="color:#fff">500</span></div>
<div style="background:var(--n-600)"><span style="color:#fff">600</span></div>
<div style="background:var(--n-700)"><span style="color:#fff">700</span></div>
<div style="background:var(--n-800)"><span style="color:#fff">800</span></div>
<div style="background:var(--n-900)"><span style="color:#fff">900</span></div>
</div>
<div class="roles"><span><b>25–50</b> surfaces</span><span><b>200–300</b> borders</span><span><b>400</b> disabled</span><span><b>500–600</b> muted text</span><span><b>900</b> ink</span></div>
</body></html>
