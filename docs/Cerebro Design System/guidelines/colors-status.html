<!-- @dsCard group="Colors" viewport="700x150" subtitle="Workflow statuses + health" name="Status & health" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:var(--r-sm);background:var(--n-50);border:1px solid var(--n-200);font-weight:500;font-size:var(--text-xs)}
.st svg{width:12px;height:12px}
.h{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-full);font-weight:500;font-size:var(--text-xs)}
.h i{width:8px;height:8px;border-radius:50%;font-style:normal}</style></head><body>
<div class="row" id="statuses"></div>
<div class="row">
<span class="h" style="background:var(--success-50);color:var(--success-700)"><i style="background:var(--health-on)"></i>On track</span>
<span class="h" style="background:var(--warn-50);color:var(--warn-700)"><i style="background:var(--health-risk)"></i>At risk</span>
<span class="h" style="background:var(--danger-50);color:var(--danger-700)"><i style="background:var(--health-off)"></i>Off track</span>
<span class="h" style="background:var(--n-50);color:var(--text-muted)"><i style="background:var(--health-none)"></i>No status</span>
</div>
<script>const flag=c=>`<svg viewBox="0 0 24 24" fill="${c}" stroke="none"><path d="M6 3h13l-3.5 5L19 13H6v8H4V3h2z"/></svg>`;
document.getElementById('statuses').innerHTML=[['New idea','--status-idea'],['Planned','--status-planned'],['In progress','--status-progress'],['Validation','--status-validation'],['Released','--status-released'],["Won't do",'--status-wontdo']].map(([n,v])=>`<span class="st">${flag(`var(${v})`)}${n}</span>`).join('');</script>
</body></html>
