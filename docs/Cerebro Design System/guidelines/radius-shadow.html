<!-- @dsCard group="Foundations" viewport="700x170" subtitle="Radii 4–14 + layered ink shadows" name="Radius & elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;display:flex;gap:24px;background:var(--n-25)}
.g{display:flex;gap:10px;align-items:flex-end}
.sq{width:56px;height:56px;background:#fff;border:1px solid var(--n-200);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.sh{width:92px;height:64px;background:#fff;border-radius:var(--r-lg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="g">
<div class="sq" style="border-radius:var(--r-xs)">4</div>
<div class="sq" style="border-radius:var(--r-sm)">6</div>
<div class="sq" style="border-radius:var(--r-md)">8</div>
<div class="sq" style="border-radius:var(--r-lg)">10</div>
<div class="sq" style="border-radius:var(--r-xl)">14</div>
</div>
<div class="g">
<div class="sh" style="box-shadow:var(--shadow-xs)">xs</div>
<div class="sh" style="box-shadow:var(--shadow-sm);border:1px solid var(--n-200)">sm+line</div>
<div class="sh" style="box-shadow:var(--shadow-md)">md</div>
<div class="sh" style="box-shadow:var(--shadow-lg)">lg</div>
</div>
</body></html>
