<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px}
.bars{display:flex;align-items:flex-end;gap:14px}
.b{text-align:center}
.b i{display:block;background:var(--cortex-200);border-radius:3px;width:26px}
.b span{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);display:block;margin-top:5px}
.consts{display:flex;gap:14px;margin-top:14px;font-size:var(--text-xs);color:var(--text-muted);flex-wrap:wrap}
.consts b{color:var(--text-secondary);font-weight:500}</style></head><body>
<div class="bars">
<div class="b"><i style="height:4px"></i><span>1·4</span></div>

<div class="b"><i style="height:16px"></i><span>4·16</span></div>
<div class="b"><i style="height:20px"></i><span>5·20</span></div>
<div class="b"><i style="height:24px"></i><span>6·24</span></div>
<div class="b"><i style="height:32px"></i><span>8·32</span></div>
<div class="b"><i style="height:40px"></i><span>10·40</span></div>
<div class="b"><i style="height:48px"></i><span>12·48</span></div>
<div class="b"><i style="height:64px"></i><span>16·64</span></div>
</div>
<div class="consts"><span><b>rail</b> 56</span><span><b>sidebar</b> 264</span><span><b>top bar</b> 64</span><span><b>row</b> 40</span><span><b>control</b> 32/28</span><span><b>detail panel</b> 420</span></div>
</body></html>
