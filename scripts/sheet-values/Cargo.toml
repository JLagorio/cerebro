[package]
name = "cerebro-sheet-values"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ironcalc_base = "=0.8.3"
bitcode = "=0.6.9"
serde_json = "=1.0.154"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
