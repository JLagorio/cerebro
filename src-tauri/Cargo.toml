[package]
name = "cerebro"
version = "0.1.0"
description = "Cerebro — files-first work management"
edition = "2021"

[lib]
name = "cerebro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
notify = "6"
chrono = "0.4"
