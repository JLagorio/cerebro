[package]
name = "cerebro"
version = "0.1.0"
description = "Cerebro — files-first work management"
edition = "2021"
# Declared so the crate is not the one unlicensed node in its own dependency
# graph (M32.6). Matches the Apache-2.0 LICENSE the DMG bundles and ships.
license = "Apache-2.0"

[lib]
name = "cerebro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
walkdir = "2"
notify = "6"
chrono = "0.4"
trash = "5"
# Loopback MCP endpoint (M6). tiny_http over axum on purpose: the endpoint
# answers a handful of JSON-RPC methods on 127.0.0.1 from a small fixed pool
# of threads (M54.6), which needs a socket and a body parser, not an async
# web framework and its ~100 transitive crates.
tiny_http = "0.12"
rand = "0.8"
# stdio connector approval keys (PR #5 security review): the ledger stores
# SHA-256 digests of the env-bearing fingerprints, never the strings.
sha2 = "0.10"
# Decodes PNG bytes sent over the JSON invoke channel for export_png (M29.4).
base64 = "0.22"
# The ledger's disposable materialized index (M21.5): rebuildable from
# segments, lives in app-data, never synced, never authoritative. `bundled`
# compiles SQLite in — no system dependency, and one pinned SQLite version
# is what makes rebuild-from-zero byte-deterministic.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# `normalize_alias_v1` (M22.1): NFKC normalization tables. Rust/TS parity is
# pinned by shared conformance vectors, not by trusting either runtime.
unicode-normalization = "0.1"
# Ordered maps for schema-v1 TypedValue objects (M22.1). Already in-tree as
# serde_json's preserve_order backend; used directly for typed recursion.
indexmap = { version = "2", features = ["serde"] }
# The local-day budget window (M25.2). A "day" is the half-open interval
# between consecutive LOCAL midnights converted to UTC, which needs the IANA
# database to stay honest across DST (23- and 25-hour days are real) and to
# honour a timezone the owner set that is not this machine's.
# `iana-time-zone` reads the system zone ID once, at the first settings
# version; `chrono-tz` resolves that ID's transitions.
chrono-tz = "0.10"
iana-time-zone = "0.1"
# The diagnostic log (M53.24, src/diagnostics.rs). The facade only: tauri,
# wry and tao already log through it, so their warnings reach the same file
# as ours. The appender is ours, so there is no tracing-subscriber and no
# plugin-log. Already in the lock through tauri.
log = "0.4"

[target.'cfg(unix)'.dependencies]
# Ending a run (M53.10, spawn.rs): std can neither send SIGTERM nor signal a
# process group, and a run is the CLI plus everything it started. One killpg
# call, behind one SAFETY comment. Already in the lock through tauri.
libc = "0.2"

# The Rust rails (M53.21). A suppression is #[expect(lint, reason = "...")],
# which fails the gate once its lint stops firing; an #[allow] would not.
# disallowed_methods enforces clippy.toml. The print lints (M53.24) send
# every line to the diagnostic log instead. src/rails.rs pins this table.
[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"
print_stdout = "deny"
print_stderr = "deny"
