[package]
default-run = "cerebro"
name = "cerebro"
version = "0.1.0"
description = "Cerebro — files-first work management"
edition = "2021"
resolver = "2"
# Declared so the crate is not the one unlicensed node in its own dependency
# graph (M32.6). Matches the Apache-2.0 LICENSE the DMG bundles and ships.
license = "Apache-2.0"

[features]
# Explicit disposable native acceptance executable; never enabled by default.
native-read-smoke = []
# Authenticated disposable acquisition metadata only; no provider or secret adapters.
native-credential-smoke = ["native-read-smoke"]
# Packaged disposable Keychain adapter acceptance; never enabled by default.
native-keychain-smoke = ["native-read-smoke"]
# Explicit disposable fixed-provider action acceptance, never a default feature.
native-action-smoke = ["native-read-smoke"]

[[bin]]
name = "native-read-smoke"
path = "src/bin/native-read-smoke.rs"
required-features = ["native-read-smoke"]

[lib]
name = "cerebro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The packaging snapshot reads the same private-mail roots as the app.
serde_json = "1"

[dependencies]
# D12 (M64.5): current plugins need Tauri 2.12. The crate and JS API
# move together because the CLI checks their minor version.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_yaml = "0.9"
# M99: bounded native syntax evidence before Serde discards anchors. Already locked, MIT.
unsafe-libyaml = "=0.2.11"
walkdir = "2"
notify = "6"
chrono = "0.4"
trash = "5"
# Loopback MCP transports: per-run bearers (M6) and opt-in personal tokens
# (M62.5b). Fixed thread pools on 127.0.0.1 need a socket and a body parser,
# not an async web framework and its ~100 transitive crates.
tiny_http = "0.12"
rand = "0.8"
# stdio connector approval keys (PR #5 security review): the ledger stores
# SHA-256 digests of the env-bearing fingerprints, never the strings.
sha2 = "0.10"
# Decodes PNG bytes sent over the JSON invoke channel for export_png (M29.4).
base64 = "0.22"
# Local media addresses encode each relative-path segment (already locked through url).
percent-encoding = "2"
# The ledger's disposable materialized index (M21.5): rebuildable from
# segments, lives in app-data, never synced, never authoritative. `bundled`
# compiles SQLite in — no system dependency, and one pinned SQLite version
# is what makes rebuild-from-zero byte-deterministic.
rusqlite = { version = "0.40.1", features = ["bundled", "backup", "serialize"] }
# `normalize_alias_v1` (M22.1): NFKC normalization tables. Rust/TS parity is
# pinned by shared conformance vectors, not by trusting either runtime.
unicode-normalization = "0.1"
# Ordered maps for schema-v1 TypedValue objects (M22.1). Already in-tree as
# serde_json's preserve_order backend; used directly for typed recursion.
indexmap = { version = "2", features = ["serde"] }
# The local-day budget window (M25.2). A "day" is the half-open interval
# between consecutive LOCAL midnights converted to UTC, which needs the IANA
# database to stay honest across DST (23- and 25-hour days are real) and to
# honour a timezone the owner set that is not this machine's.
# `iana-time-zone` supplies the budget's first settings version and each
# structured database read and list_agenda call; `chrono-tz` resolves that ID's transitions.
chrono-tz = "0.10"
iana-time-zone = "0.1"
# The diagnostic log (M53.24, src/diagnostics.rs). The facade only: tauri,
# wry and tao already log through it, so their warnings reach the same file
# as ours. The appender is ours, so there is no tracing-subscriber and no
# plugin-log. Already in the lock through tauri.
log = "0.4"
# Upstream, never Macro's fork or a git revision. Paired with npm wasm
# 0.8.3 at gitHead 9bed9ec; both engines move together by hand (M67.1).
ironcalc_base = "=0.8.3"
# XLSX in/out, the exact crates.io release of the calculation engine.
ironcalc = "=0.8.3"
# M66.7: bounded Office extraction only; calamine's picture feature is off.
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.41.0"
calamine = { version = "=0.36.1", default-features = false, features = ["dates"] }
# M66.8: document pictures decode only through files/images.rs, inside Limits.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# M69.3: execute the shared import URL grammar (already locked transitively).
regex = "=1.13.1"

[dev-dependencies]
ironcalc_base = { version = "=0.8.3", features = ["mock_time"] }
# M99.1: Rust-owned wire schemas, exported and checked only by contract tests.
# Already locked through Tauri; this adds no generator to the shipped binary.
schemars = "=0.8.22"

[target.'cfg(unix)'.dependencies]
# Ending a run (M53.10, spawn.rs): std can neither send SIGTERM nor signal a
# process group, and a run is the CLI plus everything it started. One killpg
# call, behind one SAFETY comment. Already in the lock through tauri.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# M96: fixed authenticated native identity read, no default proxies/cookies/HTTP2.
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
# Existing Tauri runtime; select only owned request/deadline/cancellation futures.
tokio = { version = "=1.53.1", features = ["time", "macros"] }
# M96.2: owner-selected native Keychain. The safe crate constructs access control;
# narrow SecItem FFI adds no-UI requests and validates size before copying data.
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }
security-framework-sys = { version = "=2.17.0", default-features = false, features = ["OSX_10_15"] }
core-foundation = "=0.10.1"
# M64.6: already locked through Tauri. Its notification plugin reports a
# desktop permission as granted and identifies dev posts as Terminal; use
# UNUserNotificationCenter directly, guarded by the installed bundle id.
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSError", "NSURL"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound"] }

# The Rust rails (M53.21). A suppression is #[expect(lint, reason = "...")],
# which fails the gate once its lint stops firing; an #[allow] would not.
# disallowed_methods enforces clippy.toml. The print lints (M53.24) send
# every line to the diagnostic log instead. src/rails.rs pins this table.
[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_methods = "deny"
print_stdout = "deny"
print_stderr = "deny"
